<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Ubuntu rise Foundation</title>
    <style>
        /* ===== Global page reset & base styling (same theme as all pages) ===== */
        body {
            margin: 0;
            padding: 0;
            font-family: Georgia, 'Times New Roman', serif;
            background-color: #1b3a34;
            background-image: linear-gradient(160deg, #1b3a34 0%, #2f5d50 45%, #c98a3e 100%);
            background-attachment: fixed;
            color: #fdf8ee;
        }

        /* ===== Header / hero banner styling ===== */
        header {
            text-align: center;
            padding: 60px 20px 40px 20px;
        }
        header h1 {
            font-size: 2.8em;
            margin: 0;
            letter-spacing: 1px;
            color: #f4c76b;
        }
        header p {
            font-size: 1.2em;
            margin-top: 10px;
            font-style: italic;
            color: #fdf8ee;
        }

        /* ===== Navigation bar styling ===== */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.2);
        }
        nav a {
            color: #fdf8ee;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 30px;
            border: 2px solid #f4c76b;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        nav a:hover {
            background-color: #f4c76b;
            color: #1b3a34;
        }

        /* ===== Enquiry form "card" container ===== */
        section {
            max-width: 600px;
            margin: 50px auto;
            padding: 40px;
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
        }
        section h2 {
            font-size: 1.8em;
            color: #f4c76b;
            margin: 0 0 10px 0;
            text-align: center;
        }
        section > p {
            font-size: 1.1em;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 30px;
        }

        /* ===== Individual form field wrapper (label + input pair) ===== */
        .field {
            margin-bottom: 20px; /* Vertical spacing between each form field */
        }
        label {
            display: block; /* Puts each label on its own line above its input */
            margin-bottom: 6px;
            font-weight: bold;
            color: #f4c76b;
        }
        .hint {
            font-weight: normal;
            font-style: italic;
            color: #fdf8ee;
            margin-left: 6px; /* Small gap between the label text and the "(optional)" hint */
        }

        /* ===== Form input styling (text fields, dropdown, textarea) ===== */
        input, select, textarea {
            width: 100%; /* Inputs stretch to fill the form's width */
            padding: 10px;
            font-family: Georgia, 'Times New Roman', serif; /* Match inputs to the site's serif font */
            font-size: 1em;
            border: none;
            border-radius: 8px;
            box-sizing: border-box; /* Ensures padding doesn't push inputs wider than their container */
        }

        /* ===== Submit button styling ===== */
        .btn {
            display: block;
            width: 100%; /* Full-width button to match the form fields above it */
            margin-top: 10px;
            padding: 14px 32px;
            background-color: #f4c76b;
            color: #1b3a34;
            border: none;
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: bold;
            font-size: 1em;
            border-radius: 30px;
            cursor: pointer; /* Shows a pointer cursor to indicate it's clickable */
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #ffdb94;
            transform: scale(1.02); /* Subtle "pop" effect on hover */
        }
    </style>
</head>
<body>
    <!-- Site header (repeated on every page) -->
    <header>
        <h1>Ubuntu rise Foundation</h1>
        <p>Rising together, Empowering communities.</p>
    </header>

    <!-- Main navigation (repeated on every page) -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="enquiry.html">Enquiry</a>
    </nav>

    <!-- Enquiry form section -->
    <section>
        <h2>Enquire</h2>
        <p>Please fill in the form with your details and we will get back to you.</p>

        <!-- NOTE: action="#" means this form doesn't actually submit anywhere yet -
             it will need a real backend/endpoint or a form service (e.g. Formspree) to send data -->
        <form action="#" method="post">

            <!-- Full name field (required) -->
            <div class="field">
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" name="fullname" placeholder="e.g. Thumedi Makgahlela" required>
            </div>

            <!-- Phone or email contact field (required) -->
            <div class="field">
                <label for="contactdetails">Phone or Email</label>
                <input type="text" id="contactdetails" name="contactdetails" placeholder="e.g. 012 345 67890 or you@email.com" required>
            </div>

            <!-- Dropdown to choose which service the enquiry is about (required) -->
            <div class="field">
                <label for="service">Preferred service</label>
                <select id="service" name="service" required>
                    <option value="">Select a service</option>
                    <option value="Donating">Donating</option>
                    <option value="community service">Community service</option>
                </select>
            </div>

            <!-- Optional date picker for availability -->
            <div class="field">
                <label for="dateavailability">Date availability</label>
                <input type="date" id="dateavailability" name="dateavailability">
            </div>

            <!-- Optional free-text message box -->
            <div class="field">
                <label for="message">Anything else<span class="hint">(optional)</span></label>
                <textarea id="message" name="message" rows="4" placeholder="e.g. time of availability"></textarea>
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn">Done</button>
        </form>
    </section>
</body>
</html>
